[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "pier5"
version = "0.1.0"
description = "More Pythonic take on Processing Python interface"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Ülgen Sarıkavak", email = "foss@ulgenwanders.net" },
]
requires-python = ">=3.12,<3.16"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    # TODO:
    #   py5 doesn't declare support for 3.12+ yet, but I haven't encounter a blocker / breaking issue yet.
    #   https://github.com/py5coding/py5generator/issues/794
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    # 3.10.8 is the earliest version with Python 3.14 support
    "matplotlib>=3.10.8",
    "py5",
    # 2.9.0 is selected as min thanks to its performance improvements.
    # https://github.com/connor-makowski/type_enforced/releases/tag/2.9.0
    "type-enforced>=2.9.0",
    # 4.16.0 is the earliest version with Python 3.15 support
    "typing-extensions>=4.16.0",
]

[project.urls]
Homepage = "https://github.com/ulgens/pier5"
Source = "https://github.com/ulgens/pier5"
Issues = "https://github.com/ulgens/pier5/issues"

[dependency-groups]
dev = [
    "copier==9.17.2",
    "copier-template-extensions==0.3.3",
    "faker==40.37.0",
    "ipdb==0.13.13",
    "ipython==9.17.0",
    # Having ruff in the venv helps with IDE's auto lint/format integrations
    "ruff==0.16.6",
    "ty==0.0.78",
    { include-group = "pytest" },
]
pytest = [
    "pytest==9.1.1",
    "pytest-randomly==4.1.0",
    "pytest-xdist==3.8.0",
]

[tool.uv]
# The earliest version that supports the current lock file revision
required-version = ">=0.8.4"

[tool.uv.sources]
py5 = { git = "https://github.com/ulgens/py5", branch = "updated" }
